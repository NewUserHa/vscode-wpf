
name: Build VSIX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows VSIX
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Show build environment
        shell: pwsh
        run: |
          node --version
          npm --version
          dotnet --list-sdks
          pwsh --version

      - name: Install npm dependencies
        run: npm ci

      - name: Build extension and tools
        shell: pwsh
        run: |
          ./dist.all.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-wpf-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
