
name: Build VSIX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows VSIX
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Update WpfDesigner
        run: |
          git submodule sync external/WpfDesigner
          git submodule update --init --remote external/WpfDesigner

      - name: Commit submodule update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add external/WpfDesigner

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update WpfDesigner submodule"
            if ($LASTEXITCODE -ne 0) {
              throw "Git commit failed"
            }

            git push
            if ($LASTEXITCODE -ne 0) {
              throw "Git push failed"
            }
          }
          else {
            Write-Host "Submodule is already up to date"
          }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x

      - name: Show build environment
        shell: pwsh
        run: |
          node --version
          npm --version
          dotnet --list-sdks
          pwsh --version

      - name: Install npm dependencies
        run: npm ci

      - name: Build extension and tools
        shell: pwsh
        run: |
          ./dist.all.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
